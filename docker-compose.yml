version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formsaathi-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/generated:/app/backend/generated
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: formsaathi-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
